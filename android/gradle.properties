org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The pub cache lives on C: while this project is on D:. Kotlin's incremental
# compiler cannot relativize paths across drives, so it throws on every build
# and silently falls back to a full compile anyway. Turning it off keeps builds
# quiet and deterministic.
kotlin.incremental=false
